services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  traceability-postgres:              # Previously: postgres
    image: postgres:18-alpine
    container_name: chopshop-postgres
    environment:
      POSTGRES_DB: chopshop
      POSTGRES_USER: chopshop
      POSTGRES_PASSWORD: chopshop
    ports:
      - "5433:5432"
    volumes:
      - chopshop_postgres_data:/var/lib/postgresql
  registration-postgres:
    image: postgres:18-alpine
    container_name: chopshop-registration-postgres
    environment:
      POSTGRES_DB: registration
      POSTGRES_USER: registration
      POSTGRES_PASSWORD: registration
    ports:
      - "5434:5432"
    volumes:
      - registration_postgres_data:/var/lib/postgresql

  processing-postgres:
    image: postgres:18-alpine
    container_name: chopshop-processing-postgres
    environment:
      POSTGRES_DB: processing
      POSTGRES_USER: processing
      POSTGRES_PASSWORD: processing
    ports:
      - "5435:5432"
    volumes:
      - processing_postgres_data:/var/lib/postgresql

  packaging-postgres:
    image: postgres:18-alpine
    container_name: chopshop-packaging-postgres
    environment:
      POSTGRES_DB: packaging
      POSTGRES_USER: packaging
      POSTGRES_PASSWORD: packaging
    ports:
      - "5436:5432"
    volumes:
      - packaging_postgres_data:/var/lib/postgresql

volumes:
  rabbitmq_data:
  chopshop_postgres_data:
  registration_postgres_data:
  processing_postgres_data:
  packaging_postgres_data:
