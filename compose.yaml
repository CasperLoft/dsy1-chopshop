services:
  postgres:
    image: postgres:18-alpine
    container_name: chopshop-postgres
    environment:
      POSTGRES_DB: chopshop
      POSTGRES_USER: chopshop
      POSTGRES_PASSWORD: chopshop
    ports:
      - "5433:5432"
    volumes:
      - chopshop_postgres_data:/var/lib/postgresql

volumes:
  chopshop_postgres_data: