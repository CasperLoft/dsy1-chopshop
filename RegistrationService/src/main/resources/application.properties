spring.application.name=RegistrationService
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5434/registration
spring.datasource.username=registration
spring.datasource.password=registration

spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Keep health checks responsive when the database is unavailable.
spring.datasource.hikari.connection-timeout=1500
