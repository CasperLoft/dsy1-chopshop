spring.application.name=PackagingService
server.port=8083
spring.datasource.url=jdbc:postgresql://localhost:5436/packaging
spring.datasource.username=packaging
spring.datasource.password=packaging
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate

# Keep health checks responsive when the database is unavailable.
spring.datasource.hikari.connection-timeout=1500
